name: Generate Image Links

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'LINKS.md'
      - '.github/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate LINKS.md
        run: |
          echo "# 最新アップロード画像一覧" > LINKS.md
          echo "" >> LINKS.md
          REPO="${{ github.repository }}"
          find . -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.gif" -o -iname "*.webp" -o -iname "*.svg" \) \
            -printf "%T@ %p\n" | sort -rn | head -n 30 | cut -d' ' -f2- | sed 's|^\./||' | while IFS= read -r file; do
            ENCODED_FILE="${file// /%20}"
            URL="https://jsdelivr.net{REPO}@main/${ENCODED_FILE}"
            echo "### ${file}" >> LINKS.md
            echo '```markdown' >> LINKS.md
            echo "![画像](\${URL})" >> LINKS.md
            echo '```' >> LINKS.md
            echo "" >> LINKS.md
          done

      - name: Commit LINKS.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add LINKS.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update image links" && git push)
